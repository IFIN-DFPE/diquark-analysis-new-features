version: 1.0
data:
  mass_cut: 7250
  backgrounds_file: "bkg_7250.yaml"
  signal_file: "chi-chi/zt-zt/sig_7750.yaml"
  total_luminosity: 3000

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  n_jets: 32

preprocessing:
  scaler: "minmax"
  test_size: 0.2
  random_state: 42
  oversample_signal: true

models:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42

  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 3
    subsample: 1.0
    colsample_bytree: 1.0
    random_state: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  evaluation:
    thresholds: [0.2, 0.5, 0.8, 0.90, 0.925, 0.95, 0.96, 0.97, 0.98, 0.99]
    use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics

results:
  directory: "results/New_Channels/zt-zt/136_S7750_B7250"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
