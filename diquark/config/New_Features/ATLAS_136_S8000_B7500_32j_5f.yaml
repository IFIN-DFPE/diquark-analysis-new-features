version: 1.0
data:
  mass_cut: 7500 # Mass cut in GeV
  backgrounds_file: "bkg_7500.yaml"
  signal_file: "chi-chi/wb-wb/yuu-020/m_chi-2000/sig_8000.yaml"
  total_luminosity: 3000

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  n_jets: 6

preprocessing:
  scaler: "minmax" # Options: 'standard', 'minmax'
  test_size: 0.2
  random_state: 42
  oversample_signal: true

models:
  random_forest:
    n_estimators: 200
    random_state: 42

  gradient_boosting:
    n_estimators: 200
    random_state: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  thresholds:
    [0.2, 0.5, 0.6, 0.7, 0.8, 0.85, 0.90, 0.925, 0.95, 0.96, 0.97, 0.98, 0.99]
  use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics

results:
  # directory: "results/New_Features/wb-wb/yuu-020/m_chi-2000/136_S8000_B7500"
  directory: "results/original_features/original_data"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
