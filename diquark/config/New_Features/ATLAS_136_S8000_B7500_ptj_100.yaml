version: 1.0
data:
  backgrounds_file: "bkg_7500_ptj_100.yaml"
  signal_file: "chi-chi/wb-wb/yuu-020/m_chi-2000/sig_8000.yaml"
  total_luminosity: 3000

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  n_jets: 6

preprocessing:
  scaler: "minmax"
  test_size: 0.2
  random_state: 13
  oversample_signal: true

models:
  random_forest:
    n_estimators: 200
    random_state: 17

  gradient_boosting:
    n_estimators: 200
    random_state: 17

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  thresholds: [0.5, 0.6, 0.65, 0.66, 0.67, 0.68, 0.69, 0.7, 0.8, 0.85, 0.90, 0.925, 0.95]
  use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics

results:
  # directory: "results/New_Features/ATLAS_136_S8000_B7500_ptj_100"
  directory: "results/original_features/pythia_with_pthatmin_100"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
