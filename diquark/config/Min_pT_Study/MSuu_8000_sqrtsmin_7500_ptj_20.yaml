version: 1.0
data:
  backgrounds_file: "MadGraph5_Backgrounds/bkg_sqrtsmin_7500_ptj_20.yaml"
  signal_file: "chi-chi/wb-wb/yuu-020/m_chi-2000/sqrtsmin/sig_MSuu_8000_sqrtsmin_7500_ptj_20.yaml"
  total_luminosity: 3000

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  n_jets: 32

preprocessing:
  scaler: "minmax"
  test_size: 0.2
  random_state: 13
  oversample_signal: true

models:
  random_forest:
    n_estimators: 200
    random_state: 17

  gradient_boosting:
    n_estimators: 200
    random_state: 17

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  evaluation:
    thresholds:
      [0.2, 0.5, 0.6, 0.7, 0.8, 0.85, 0.90, 0.925, 0.95, 0.96, 0.97, 0.98, 0.99]
    use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics

results:
  directory: "results/Min_pT_Study/MSuu_8000_sqrtsmin_7500_ptj_20"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
