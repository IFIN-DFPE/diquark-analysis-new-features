version: 1.0
data:
  backgrounds_file: "MadGraph5_Backgrounds/bkg_shatmin_7500_htjmin_2000.yaml"
  signal_file: "chi-chi/wb-wb/yuu-020/m_chi-2000/sig_MSuu_8000_shatmin_7500_htjmin_2000.yaml"
  total_luminosity: 3000

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  feature_set: "new"
  n_jets: 32

preprocessing:
  scaler: "minmax"
  test_size: 0.2
  random_state: 13
  oversample_signal: false

models:
  random_forest:
    n_jobs: 100
    n_estimators: 512
    random_state: 17

  gradient_boosting:
    n_jobs: 100
    n_estimators: 512
    random_state: 17

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  thresholds: [0.5, 0.6, 0.65, 0.7, 0.8, 0.85, 0.90, 0.925, 0.95, 0.975]
  use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics

results:
  directory: "results/MadGraph_Data/MSuu_8000_shatmin_7500_htjmin_2000"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
