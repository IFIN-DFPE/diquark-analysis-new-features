version: 1.0
data:
  backgrounds_file: "MadGraph5_Backgrounds/bkg_shatmin_7500_htjmin_2800.yaml"
  signal_file: "chi-chi/wb-wb/yuu-020/m_chi-2000/sig_MSuu_8000_shatmin_7500_htjmin_2800.yaml"
  total_luminosity: 3000
  # index_stop: 100

cross_validation:
  enabled: true
  n_folds: 5

feature_extraction:
  n_jets: 32

preprocessing:
  scaler: "standard"
  test_size: 0.2
  random_state: 15
  oversample_signal: true

models:
  random_forest:
    n_estimators: 1024
    random_state: 23

  gradient_boosting:
    n_estimators: 1024
    random_state: 23

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - average_precision
  thresholds: [0.5, 0.6, 0.7, 0.8, 0.90, 0.925, 0.94, 0.95, 0.96, 0.97, 0.98, 0.99]
  use_real_event_percentiles: false

visualization:
  plots:
    - roc_curve
    - pr_curve
    - feature_importances
    - sig_bkg_metrics
    - scores_histogram
    - scores_weighted_histogram

results:
  directory: "results/MadGraph_Data/MSuu_8000_shatmin_7500_htjmin_2800"
  save_predictions: true
  save_feature_importances: true

logging:
  file_path: "logs/experiment.log"
  level: "INFO"
